name: CI

on:
  push:
    branches: [main, queue]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # v7 writes an npm cache unless this is false. CI installs from the lockfile.
          package-manager-cache: false
      # npm ci runs prepare, which builds dist/ for the scenarios.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run archstrict
      - run: npm test
      - run: npm run test:scenarios
